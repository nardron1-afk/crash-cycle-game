<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crash Cycle">
<meta name="theme-color" content="#1a2030">
<title>Crash Cycle</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a2030;
touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
Promise.all(["g0.js","g1.js","g2.js","g3.js"].map(f=>fetch(f).then(r=>r.text())))
.then(p=>{const s=document.createElement("script");s.textContent=p.join("");document.body.appendChild(s);});
</script>
</body>
</html>
